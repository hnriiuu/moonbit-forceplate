name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix_installer.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: MoonBit Check
        run: moon check

      - name: MoonBit Test
        run: moon test

      - name: Check Code Formatting
        run: moon fmt --deny-warn

      - name: Check Package Interface Files (.mbti)
        run: moon info --deny-warn
